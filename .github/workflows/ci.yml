name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Um push novo cancela a execução anterior do mesmo branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gates (typecheck, conteúdo, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # 24: os scripts do gate são TypeScript rodando direto no Node, sem
          # tsx — precisam do type stripping ligado por padrão. É a mesma
          # versão usada na máquina da autoria.
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Gate de conteúdo (plano da F1, §3.4). Roda OFFLINE, a partir do cache
      # de tablebase versionado em content/tablebase-cache/: a rede só existe
      # na autoria. Nunca acrescente --refresh-cache aqui.
      - name: Validar conteúdo
        run: npm run validate:content

      # Testes da lógica pura do motor: o julgamento do lance do aluno (§3.2)
      # e os textos de recusa. Sem navegador — rodam no test runner do Node.
      - name: Testes
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
